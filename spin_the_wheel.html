<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Spin the Dew</title>
    <link rel="icon" type="image/x-icon" href="logo_mtdew.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./tailwind.output.css" />
    <!-- Add Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      :root {
        --pixel-lime: #a3e635;
        --pixel-lime-bright: #d9f99d;
        --pixel-green-deep: #052e16;
        --pixel-emerald: #064e3b;
        --pixel-shadow: rgba(0, 0, 0, 0.75);
      }

      /* Prevent text selection when tapping rapidly on a tablet */
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        overflow: hidden; /* Lock scrolling completely for app-like feel */
        position: relative;
        font-family: "VT323", monospace;
        letter-spacing: 0.03em;
        background-color: rgb(0, 104, 51);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(217, 249, 157, 0.04),
          rgba(217, 249, 157, 0.04) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: soft-light;
        opacity: 0.5;
        z-index: 1;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(
            rgba(163, 230, 53, 0.22) 1px,
            transparent 1px
          ),
          radial-gradient(rgba(101, 163, 13, 0.18) 1px, transparent 1px);
        background-size: 32px 32px, 48px 48px;
        background-position: 0 0, 12px 12px;
        opacity: 0.55;
        z-index: 2;
      }

      .pixel-title {
        font-family: "Press Start 2P", monospace;
        text-shadow: 0 0 16px rgba(163, 230, 53, 0.9),
          4px 4px 0 var(--pixel-shadow);
        line-height: 1.1;
      }

      .pixel-subtitle,
      .pixel-text {
        font-family: "VT323", monospace;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }

      .pixel-btn {
        font-family: "Press Start 2P", monospace;
        border-radius: 0.6rem;
        box-shadow: 0 0 0 3px rgba(217, 249, 157, 0.3),
          0 14px 30px rgba(0, 0, 0, 0.55);
        image-rendering: pixelated;
      }

      .pixel-panel {
        border-radius: 0.8rem;
        border-style: solid;
        box-shadow: inset 0 0 0 2px rgba(217, 249, 157, 0.08),
          0 0 45px rgba(132, 204, 22, 0.28);
      }

      .hud-shell {
        width: min(980px, calc(100vw - 2rem));
      }

      .spin-shell {
        width: min(780px, calc(100vw - 2rem));
      }

      .intro-glow {
        animation: pulseGlow 2.6s ease-in-out infinite;
      }

      @keyframes pulseGlow {
        0%,
        100% {
          text-shadow: 0 0 12px rgba(163, 230, 53, 0.65),
            4px 4px 0 var(--pixel-shadow);
        }
        50% {
          text-shadow: 0 0 18px rgba(190, 242, 100, 0.95),
            4px 4px 0 var(--pixel-shadow);
        }
      }

      .scene-assets {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
      }

      .scene-logo {
        position: absolute;
        top: 1.4rem;
        left: 1.1rem;
        width: clamp(72px, 9vw, 124px);
        opacity: 0.9;
        filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
      }

      .scene-bottle {
        position: absolute;
        width: clamp(95px, 11vw, 180px);
        opacity: 0.75;
        filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.45));
      }

      .scene-bottle-left {
        left: 0.5rem;
        bottom: -0.2rem;
        transform: rotate(-4deg);
      }

      .scene-bottle-right {
        right: 0.4rem;
        top: 5.5rem;
        transform: rotate(6deg);
      }

      @media (max-width: 768px) {
        .scene-bottle {
          opacity: 0.5;
          width: clamp(70px, 15vw, 120px);
        }

        .scene-bottle-right {
          top: 7.5rem;
        }
      }

      /* Container scales perfectly based on the smallest screen dimension */
      .wheel-wrapper {
        position: relative;
        /* Keep the wheel prominent while preserving breathing room for controls/text */
        width: min(82vw, 58vh, 760px);
        height: min(82vw, 58vh, 760px);
        margin: 0 auto;
      }

      .wheel-wrapper::before {
        content: "";
        position: absolute;
        inset: -4%;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(163, 230, 53, 0.28) 0%,
          rgba(132, 204, 22, 0.12) 45%,
          rgba(0, 0, 0, 0) 72%
        );
        filter: blur(10px);
        z-index: 0;
      }

      @media (max-width: 1024px) {
        .wheel-wrapper {
          width: min(88vw, 60vh);
          height: min(88vw, 60vh);
        }
      }

      @media (orientation: portrait) {
        .wheel-wrapper {
          width: min(90vw, 52vh);
          height: min(90vw, 52vh);
        }
      }

      #wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 0 0 8px #022c22, 0 25px 35px -5px rgba(0, 0, 0, 0.8),
          0 0 30px rgba(132, 204, 22, 0.4);
        transform-origin: center center;
        will-change: transform;
        background-color: #022c22;
        position: relative;
        z-index: 1;
      }

      /* The pointer arrow at the top */
      .pointer {
        position: absolute;
        top: -6%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: 14%;
        height: 14%;
        filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.7));
      }

      /* Modal Animations */
      .modal-enter {
        opacity: 1 !important;
        pointer-events: auto !important;
        visibility: visible !important;
      }
      .modal-content-enter {
        transform: scale(1) !important;
      }

      /* Custom Background Pattern - Enlarged slightly for better aesthetics */
      .bg-pattern {
        background-image: none;
      }

      /* ============================================================== */
      /* Landscape iPad (A16, 1180x820) stage:                          */
      /* wheel on the left, title + SPIN + result on the right.         */
      /* ============================================================== */
      .stage-inner {
        position: relative;
        z-index: 5;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem;
      }

      .wheel-col {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      .control-col {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 1rem;
        width: 100%;
        max-width: min(780px, calc(100vw - 2rem));
      }

      /* Full-width panels inside the control column (beats .hud/.spin-shell). */
      .control-panel {
        width: 100%;
      }

      @media (orientation: landscape) {
        .stage-inner {
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: clamp(1rem, 3vw, 2.25rem);
          padding: clamp(0.5rem, 2vh, 1.25rem) clamp(1rem, 2.5vw, 2rem);
        }

        .wheel-col {
          height: 100%;
          flex: 0 1 auto;
        }

        .control-col {
          height: 100%;
          width: auto;
          max-width: none;
          flex: 0 1 auto;
          flex-basis: clamp(290px, 30vw, 400px);
          justify-content: center;
          gap: clamp(1rem, 4vh, 2rem);
        }

        /* Wheel fills the vertical space; width-capped so the column fits. */
        .wheel-wrapper {
          width: min(58vw, 86vh);
          height: min(58vw, 86vh);
          margin: 0;
        }
      }

      /* Shorter landscape (Safari toolbar visible) — tighten spacing. */
      @media (orientation: landscape) and (max-height: 720px) {
        .control-col {
          gap: 0.75rem;
        }
      }
    </style>
  </head>
  <body
    class="min-h-screen w-screen text-green-100 bg-pattern"
  >
    <div class="scene-assets" aria-hidden="true">
      <img src="logo_mtdew.png" alt="" class="scene-logo" />
      <img
        src="bottom_bottle.png"
        alt=""
        class="scene-bottle scene-bottle-left"
      />
      <img
        src="top_bottle.png"
        alt=""
        class="scene-bottle scene-bottle-right"
      />
    </div>

    <!-- Landscape stage: wheel on the left, controls on the right -->
    <main class="stage-inner">
      <!-- Wheel -->
      <div class="wheel-col">
        <div class="wheel-wrapper">
          <!-- SVG Pointer -->
          <svg
            class="pointer"
            viewBox="0 0 24 24"
            fill="#bef264"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 22L2 6L22 6L12 22Z"
              stroke="#022c22"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>

          <!-- High-resolution Canvas (Scaled down by CSS for crispness) -->
          <canvas id="wheel" width="1000" height="1000"></canvas>
        </div>
      </div>

      <!-- Title + controls -->
      <div class="control-col">
        <!-- Header -->
        <div
          class="control-panel hud-shell z-10 px-5 py-4 md:px-6 md:py-5 pixel-panel border-2 border-lime-500/40 bg-green-950/55 backdrop-blur-sm"
        >
          <h1
            class="pixel-title intro-glow text-3xl md:text-4xl text-center text-lime-300 uppercase tracking-[0.18em]"
          >
            Dew to Win!
          </h1>
          <p
            class="pixel-subtitle text-center text-green-300 mt-3 text-lg md:text-xl"
          >
            Tap the button to test your luck
          </p>
        </div>

        <!-- Controls & Winner Display -->
        <div
          class="control-panel spin-shell flex flex-col items-center space-y-4 z-10 px-4 py-5 md:px-6 md:py-6 pixel-panel border-2 border-lime-500/40 bg-green-950/55 backdrop-blur-sm"
        >
          <button
            id="spinBtn"
            class="pixel-btn w-full bg-gradient-to-b from-lime-300 to-lime-500 hover:from-lime-200 hover:to-lime-400 text-green-950 uppercase py-5 px-8 md:py-6 md:px-10 text-2xl md:text-3xl border-b-8 border-lime-800 active:border-b-0 active:translate-y-[8px] transition-all duration-150 shadow-[0_0_24px_rgba(163,230,53,0.55)]"
          >
            SPIN!
          </button>

          <div
            id="winnerDisplay"
            class="pixel-text h-10 md:h-12 flex items-center justify-center text-2xl md:text-3xl text-lime-300 text-center px-2 w-full drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]"
          >
            <!-- Dynamic text appears here during spin -->
            <span class="text-lime-500 font-bold drop-shadow-md"
              >Ready to spin!</span
            >
          </div>
        </div>
      </div>
    </main>

    <!-- Result Modal Overlay -->
    <div
      id="resultModal"
      class="fixed inset-0 flex items-center justify-center z-50 invisible opacity-0 transition-all duration-300 bg-green-950/85 backdrop-blur-md"
    >
      <!-- Removed overflow-hidden here to prevent clipping italicized text bounds -->
      <div
        id="resultContent"
        class="pixel-panel text-center p-8 md:p-14 border-4 border-lime-500 bg-green-950 shadow-[0_0_80px_rgba(132,204,22,0.5)] transform scale-50 transition-transform duration-500 w-[90%] max-w-xl relative"
      >
        <!-- Modal decorative glow (moved inside a wrapper to safely clip) -->
        <div
          class="absolute inset-0 rounded-[2.2rem] overflow-hidden pointer-events-none"
        >
          <div
            class="absolute inset-0 bg-gradient-to-tr from-lime-500/10 to-transparent"
          ></div>
        </div>

        <!-- Scaled down text size slightly to guarantee it fits tablets -->
        <h2
          id="resultTitle"
          class="pixel-title text-3xl md:text-5xl mb-4 uppercase relative z-10 break-words"
        ></h2>
        <p
          id="resultPrize"
          class="pixel-text text-2xl md:text-4xl text-lime-100 mb-8 relative z-10 drop-shadow-md"
        ></p>
        <button
          id="closeModal"
          class="pixel-btn bg-gradient-to-b from-lime-400 to-lime-600 hover:from-lime-300 hover:to-lime-500 text-green-950 uppercase text-sm md:text-lg py-4 px-10 md:px-14 border-b-8 border-lime-800 active:border-b-0 active:translate-y-[8px] transition-all shadow-lg relative z-10"
        >
          DEW IT AGAIN
        </button>
      </div>
    </div>

    <script>
      // =========================================================================
      // The wheel builds its slices automatically from live inventory
      // (managed on /admin.html). Every in-stock item gets a slice; items at
      // 0 stock disappear. PRIZE_PRIORITY items stand out in bright neon.
      // =========================================================================

      const PRIZE_PRIORITY = [
        "Mountain Dew Keychain",
        "Mountain Dew Shirt",
        "G102 mouse (white)",
      ];

      function shuffleArray(items) {
        const arr = [...items];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      // One entry per loss slice. /admin.html sets how many slices each label
      // gets (settings.lossSlices, min 1 so a losing spin always has a slice
      // to land on); 3 each until the server has sent settings.
      function getLossSlices() {
        const counts =
          serverSettings && serverSettings.lossSlices
            ? serverSettings.lossSlices
            : {};
        return LOSS_LABELS.flatMap((label) => {
          const count = Number(counts[label]);
          return Array(Number.isInteger(count) && count > 0 ? count : 3).fill(
            label
          );
        });
      }

      function buildWheelItems(productNames) {
        const products = shuffleArray(productNames);
        const losses = getLossSlices();

        const totalSlices = products.length + losses.length;
        const wheel = new Array(totalSlices);

        // Pick unique slots for losses so no wheel entry is left undefined.
        const allIndexes = Array.from({ length: totalSlices }, (_, idx) => idx);
        const lossPositions = shuffleArray(allIndexes).slice(0, losses.length);

        for (let i = 0; i < losses.length; i++) {
          wheel[lossPositions[i]] = losses[i];
        }

        let productCursor = 0;
        for (let i = 0; i < wheel.length; i++) {
          if (!wheel[i]) {
            wheel[i] = products[productCursor];
            productCursor += 1;
          }
        }

        return wheel;
      }

      let wheelItems = [];
      let lastWheelSignature = null;

      function getActiveProductNames() {
        return Object.keys(prizeInventory).filter(
          (name) => (prizeInventory[name] || 0) > 0
        );
      }

      // Includes the loss slice counts so an admin change redraws the wheel.
      function getWheelSignature(productNames) {
        return (
          [...productNames].sort().join("|") + "#" + getLossSlices().join("|")
        );
      }

      function rebuildWheel(extraNames = []) {
        const names = getActiveProductNames();
        for (const extra of extraNames) {
          if (extra && !names.includes(extra)) {
            names.push(extra);
          }
        }
        wheelItems = buildWheelItems(names);
        lastWheelSignature = getWheelSignature(names);
        drawWheel();
      }

      function rebuildWheelIfChanged() {
        if (isSpinning) {
          return;
        }

        if (getWheelSignature(getActiveProductNames()) !== lastWheelSignature) {
          rebuildWheel();
        }
      }

      const PRIZE_INVENTORY_STORAGE_KEY = "dew-wheel-prize-inventory-v4";
      const CHANCE_MULTIPLIERS_STORAGE_KEY = "dew-wheel-chance-multipliers-v14";
      const SETTINGS_STORAGE_KEY = "dew-wheel-settings-v1";
      const WHEEL_CONFIG_API_URL = "/api/wheel-config";
      const WHEEL_SPIN_API_URL = "/api/spin";
      const INVENTORY_EXPORT_API_URL = "/api/export-inventory";
      const DEFAULT_PRIZE_INVENTORY = {
        "Mountain Dew Shirt": 2,
        "Mountain Dew Keychain": 10,
        "G102 mouse (black)": 1,
        "G102 mouse (white)": 2,
        "G333 (black)": 0,
        "G333 (white)": 0,
        "G333 (lilac)": 0,
        "G335 (black)": 0,
        "G335 (white)": 1,
      };

      const DEFAULT_CHANCE_MULTIPLIERS = {
        "Mountain Dew Shirt": 1.85,
        "Mountain Dew Keychain": 2.75,
        "G102 mouse (black)": 1.0,
        "G102 mouse (white)": 1.0,
        "G333 (black)": 0.9,
        "G333 (white)": 0,
        "G333 (lilac)": 0.9,
        "G335 (black)": 0.5,
        "G335 (white)": 0.01,
      };

      function getBrowserStorage() {
        try {
          const testKey = "dew-wheel-storage-check";
          localStorage.setItem(testKey, "1");
          localStorage.removeItem(testKey);
          return localStorage;
        } catch {
          return null;
        }
      }

      function loadPrizeInventory() {
        try {
          const storage = getBrowserStorage();
          if (!storage) {
            return { ...DEFAULT_PRIZE_INVENTORY };
          }

          const saved = storage.getItem(PRIZE_INVENTORY_STORAGE_KEY);
          if (!saved) {
            const fresh = { ...DEFAULT_PRIZE_INVENTORY };
            storage.setItem(PRIZE_INVENTORY_STORAGE_KEY, JSON.stringify(fresh));
            return fresh;
          }

          const parsed = JSON.parse(saved);
          if (!parsed || typeof parsed !== "object") {
            return { ...DEFAULT_PRIZE_INVENTORY };
          }

          // Item names are dynamic (managed on /admin.html), so accept every
          // stored key rather than only the built-in defaults. An explicitly
          // EMPTY stored map is valid (admin removed all items) — do not
          // resurrect the defaults; fall back only when the data is corrupt.
          const parsedKeys = Object.keys(parsed);
          const merged = {};
          for (const [key, raw] of Object.entries(parsed)) {
            if (Number.isFinite(raw)) {
              merged[key] = Math.max(0, Math.floor(raw));
            }
          }

          if (parsedKeys.length === 0) {
            return {};
          }

          return Object.keys(merged).length
            ? merged
            : { ...DEFAULT_PRIZE_INVENTORY };
        } catch {
          return { ...DEFAULT_PRIZE_INVENTORY };
        }
      }

      function savePrizeInventory(inventory = prizeInventory) {
        try {
          const storage = getBrowserStorage();
          if (!storage) {
            return;
          }
          storage.setItem(
            PRIZE_INVENTORY_STORAGE_KEY,
            JSON.stringify(inventory)
          );
        } catch {
          // Ignore storage errors so gameplay still works.
        }
      }

      function loadChanceMultipliers() {
        try {
          const storage = getBrowserStorage();
          if (!storage) {
            return { ...DEFAULT_CHANCE_MULTIPLIERS };
          }

          const saved = storage.getItem(CHANCE_MULTIPLIERS_STORAGE_KEY);
          if (!saved) {
            const fresh = { ...DEFAULT_CHANCE_MULTIPLIERS };
            storage.setItem(
              CHANCE_MULTIPLIERS_STORAGE_KEY,
              JSON.stringify(fresh)
            );
            return fresh;
          }

          const parsed = JSON.parse(saved);
          if (!parsed || typeof parsed !== "object") {
            return { ...DEFAULT_CHANCE_MULTIPLIERS };
          }

          const parsedKeys = Object.keys(parsed);
          const merged = {};
          for (const [key, raw] of Object.entries(parsed)) {
            if (Number.isFinite(raw) && raw >= 0) {
              merged[key] = Number(raw);
            }
          }

          // Explicitly empty is valid (all items removed on /admin.html).
          if (parsedKeys.length === 0) {
            return {};
          }

          return Object.keys(merged).length
            ? merged
            : { ...DEFAULT_CHANCE_MULTIPLIERS };
        } catch {
          return { ...DEFAULT_CHANCE_MULTIPLIERS };
        }
      }

      function saveChanceMultipliers(multipliers = CHANCE_MULTIPLIERS) {
        try {
          const storage = getBrowserStorage();
          if (!storage) {
            return;
          }
          storage.setItem(
            CHANCE_MULTIPLIERS_STORAGE_KEY,
            JSON.stringify(multipliers)
          );
        } catch {
          // Ignore storage errors so gameplay still works.
        }
      }

      function loadServerSettings() {
        try {
          const storage = getBrowserStorage();
          if (!storage) {
            return null;
          }
          const saved = storage.getItem(SETTINGS_STORAGE_KEY);
          const parsed = saved ? JSON.parse(saved) : null;
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch {
          return null;
        }
      }

      function saveServerSettings(settings) {
        try {
          const storage = getBrowserStorage();
          if (!storage) {
            return;
          }
          storage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
        } catch {
          // Ignore storage errors so gameplay still works.
        }
      }

      const prizeInventory = loadPrizeInventory();

      // =====================================================================
      // Live chances/stock are managed on /admin.html (server-side).
      // The values below are only the offline fallback for when the API is
      // unreachable. Higher multiplier = higher chance among in-stock items.
      // =====================================================================
      const CHANCE_MULTIPLIERS = loadChanceMultipliers();

      function setChanceMultiplier(itemName, value) {
        if (!(itemName in CHANCE_MULTIPLIERS)) {
          return false;
        }

        const nextValue = Number(value);
        if (!Number.isFinite(nextValue) || nextValue < 0) {
          return false;
        }

        CHANCE_MULTIPLIERS[itemName] = nextValue;
        saveChanceMultipliers();
        return true;
      }

      function setChanceMultipliers(nextMultipliers = {}) {
        let changed = false;

        for (const [itemName, value] of Object.entries(nextMultipliers)) {
          const didUpdate = setChanceMultiplier(itemName, value);
          changed = changed || didUpdate;
        }

        return changed;
      }

      function resetChanceMultipliers() {
        for (const key of Object.keys(DEFAULT_CHANCE_MULTIPLIERS)) {
          CHANCE_MULTIPLIERS[key] = DEFAULT_CHANCE_MULTIPLIERS[key];
        }
        saveChanceMultipliers();
      }

      function applyStateFromServer(state) {
        if (!state) {
          return;
        }

        // The server owns the item list: mirror it exactly so items added or
        // removed on /admin.html appear/disappear here too.
        if (state.inventory && typeof state.inventory === "object") {
          for (const key of Object.keys(prizeInventory)) {
            delete prizeInventory[key];
          }
          for (const [key, raw] of Object.entries(state.inventory)) {
            if (Number.isFinite(raw)) {
              prizeInventory[key] = Math.max(0, Math.floor(raw));
            }
          }
        }

        if (state.multipliers && typeof state.multipliers === "object") {
          for (const key of Object.keys(CHANCE_MULTIPLIERS)) {
            delete CHANCE_MULTIPLIERS[key];
          }
          for (const [key, raw] of Object.entries(state.multipliers)) {
            if (Number.isFinite(raw) && raw >= 0) {
              CHANCE_MULTIPLIERS[key] = Number(raw);
            }
          }
        }

        if (state.settings && typeof state.settings === "object") {
          serverSettings = { ...state.settings };
          saveServerSettings(serverSettings);
        }

        if (Number.isFinite(state.nextMouseDueAt)) {
          nextMouseDueAt = state.nextMouseDueAt;
        }

        savePrizeInventory(prizeInventory);
        saveChanceMultipliers(CHANCE_MULTIPLIERS);
      }

      async function fetchServerState(options = {}) {
        try {
          const response = await fetch(WHEEL_CONFIG_API_URL, {
            method: "GET",
            headers: { Accept: "application/json" },
          });

          if (!response.ok) {
            return null;
          }

          const payload = await response.json();
          if (!payload?.ok || !payload?.state) {
            return null;
          }

          // Re-checked AFTER the response arrives: a spin that started (or
          // finished) while this GET was in flight has fresher state than
          // this response — applying it would resurrect stale stock.
          if (options.applyGuard && !options.applyGuard()) {
            return null;
          }

          applyStateFromServer(payload.state);
          return payload.state;
        } catch {
          return null;
        }
      }

      async function requestServerSpin() {
        try {
          const response = await fetch(WHEEL_SPIN_API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({}),
          });

          if (!response.ok) {
            return null;
          }

          const payload = await response.json();
          if (!payload?.ok || !payload?.prize || !payload?.state) {
            return null;
          }

          applyStateFromServer(payload.state);
          stateSyncEpoch += 1;
          return payload;
        } catch {
          return null;
        }
      }

      // =========================================================================
      // ⬆️ ================================================================== ⬆️
      // =========================================================================

      // Strict Green Color Palettes
      const standoutColors = [
        "#bef264", // Lime 300 (Brightest)
        "#a3e635", // Lime 400
        "#84cc16", // Lime 500
      ];

      const standardColors = [
        "#166534", // Green 800
        "#064e3b", // Emerald 900
        "#14532d", // Green 900
        "#065f46", // Emerald 800
        "#0f766e", // Teal 700
      ];

      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const spinBtn = document.getElementById("spinBtn");
      const winnerDisplay = document.getElementById("winnerDisplay");

      // Fixed internal size prevents blurry rendering on resize
      const CANVAS_SIZE = 1000;
      const centerX = CANVAS_SIZE / 2;
      const centerY = CANVAS_SIZE / 2;
      const radius = CANVAS_SIZE / 2 - 10;

      let currentRotation = 0;
      let isSpinning = false;
      let pendingWinnerItem = null;
      let serverSettings = loadServerSettings();
      // Bumped whenever spin-response state is applied, so an older in-flight
      // poll response can detect it is stale and skip applying itself.
      let stateSyncEpoch = 0;

      const EVENT_START_HOUR = 10;
      const EVENT_END_HOUR = 22;
      const ENFORCE_EVENT_WINDOW = false;
      const MOUSE_NAME_PATTERN = /mouse/i;
      const MOUSE_INTERVAL_MIN_MS = 135 * 60 * 1000;
      const MOUSE_INTERVAL_MAX_MS = 240 * 60 * 1000;
      const LOSS_LABELS = ["Better Luck Next Time", "Spin The Dew Again"];
      const ESTIMATED_TOTAL_PLAYERS = 500;
      const EVENT_DURATION_HOURS = EVENT_END_HOUR - EVENT_START_HOUR;
      const ESTIMATED_SPINS_PER_HOUR = Math.ceil(
        ESTIMATED_TOTAL_PLAYERS / EVENT_DURATION_HOURS
      );
      const MIN_PRODUCT_WIN_RATE = 0.2;
      const MAX_PRODUCT_WIN_RATE = 0.45;
      const LOW_STOCK_THRESHOLD = 3;
      const LOW_STOCK_MIN_PRODUCT_WIN_RATE = 0.1;
      const LOW_STOCK_MAX_PRODUCT_WIN_RATE = 0.3;
      let nextMouseDueAt = null;

      const LABEL_FONT_FAMILY = '"Arial Black", "Segoe UI", sans-serif';

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getMouseKeys() {
        return Object.keys(prizeInventory).filter((name) =>
          MOUSE_NAME_PATTERN.test(name)
        );
      }

      function isMouseTimerEnabled() {
        return serverSettings ? Boolean(serverSettings.mouseTimerEnabled) : true;
      }

      function randomMouseIntervalMs() {
        if (
          serverSettings &&
          Number.isFinite(serverSettings.mouseIntervalMinMinutes) &&
          Number.isFinite(serverSettings.mouseIntervalMaxMinutes)
        ) {
          return randomInt(
            serverSettings.mouseIntervalMinMinutes * 60 * 1000,
            serverSettings.mouseIntervalMaxMinutes * 60 * 1000
          );
        }

        return randomInt(MOUSE_INTERVAL_MIN_MS, MOUSE_INTERVAL_MAX_MS);
      }

      function getEventWindow() {
        const now = new Date();
        const start = new Date(now);
        const end = new Date(now);
        start.setHours(EVENT_START_HOUR, 0, 0, 0);
        end.setHours(EVENT_END_HOUR, 0, 0, 0);
        return { start, end };
      }

      function isWithinEventWindow(nowMs = Date.now()) {
        const { start, end } = getEventWindow();
        return nowMs >= start.getTime() && nowMs <= end.getTime();
      }

      function isPrizeWindowOpen(nowMs = Date.now()) {
        if (!ENFORCE_EVENT_WINDOW) {
          return true;
        }

        return isWithinEventWindow(nowMs);
      }

      function initializeMouseSchedule() {
        const nowMs = Date.now();

        if (!ENFORCE_EVENT_WINDOW) {
          nextMouseDueAt = nowMs + randomMouseIntervalMs();
          return;
        }

        const { start, end } = getEventWindow();

        if (nowMs < start.getTime()) {
          nextMouseDueAt = start.getTime() + randomMouseIntervalMs();
          return;
        }

        if (nowMs > end.getTime()) {
          nextMouseDueAt = null;
          return;
        }

        nextMouseDueAt = nowMs + randomMouseIntervalMs();
      }

      function getProductChancePercentages() {
        const productEntries = Object.entries(prizeInventory).filter(
          ([, count]) => count > 0
        );
        const total = productEntries.reduce((sum, [name, count]) => {
          const multiplier = CHANCE_MULTIPLIERS[name] ?? 1;
          return sum + count * multiplier;
        }, 0);

        if (!total) {
          return {};
        }

        return Object.fromEntries(
          productEntries.map(([name, count]) => {
            const multiplier = CHANCE_MULTIPLIERS[name] ?? 1;
            const weightedChance = (count * multiplier) / total;
            return [name, Number((weightedChance * 100).toFixed(2))];
          })
        );
      }

      function getInventoryCountForKeys(keys) {
        return keys.reduce((sum, key) => sum + (prizeInventory[key] || 0), 0);
      }

      function pickWeightedProduct({
        includeOnlyKeys = null,
        excludeKeys = [],
      } = {}) {
        const includeSet = includeOnlyKeys ? new Set(includeOnlyKeys) : null;
        const excludeSet = new Set(excludeKeys);

        const candidates = Object.entries(prizeInventory)
          .filter(([name, count]) => {
            if (count <= 0) {
              return false;
            }
            if (includeSet && !includeSet.has(name)) {
              return false;
            }
            if (excludeSet.has(name)) {
              return false;
            }
            return true;
          })
          .map(([name, count]) => {
            const multiplier = CHANCE_MULTIPLIERS[name] ?? 1;
            return {
              name,
              weight: count * multiplier,
            };
          })
          .filter((item) => item.weight > 0);

        const totalWeight = candidates.reduce(
          (sum, item) => sum + item.weight,
          0
        );
        if (!totalWeight) {
          return null;
        }

        let roll = Math.random() * totalWeight;
        for (const item of candidates) {
          roll -= item.weight;
          if (roll <= 0) {
            return item.name;
          }
        }

        return candidates[candidates.length - 1].name;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getRemainingProductCount() {
        return Object.values(prizeInventory).reduce(
          (sum, count) => sum + count,
          0
        );
      }

      function getRemainingEventMs(nowMs) {
        const { start, end } = getEventWindow();
        const startMs = start.getTime();
        const endMs = end.getTime();

        if (nowMs < startMs) {
          return endMs - startMs;
        }
        if (nowMs > endMs) {
          return 0;
        }
        return endMs - nowMs;
      }

      // Offline fallback only (live spins are decided by /api/spin). Mirrors
      // the server: settings.lossWeights from /admin.html decide which loss
      // label a losing spin shows; all weights at 0 falls back to even.
      function pickLossLabel() {
        const configured =
          serverSettings && serverSettings.lossWeights
            ? serverSettings.lossWeights
            : {};
        const entries = LOSS_LABELS.map((label) => {
          const raw = Number(configured[label]);
          return { label, weight: Number.isFinite(raw) && raw > 0 ? raw : 0 };
        }).filter((entry) => entry.weight > 0);
        const totalWeight = entries.reduce(
          (sum, entry) => sum + entry.weight,
          0
        );
        if (!totalWeight) {
          return LOSS_LABELS[Math.floor(Math.random() * LOSS_LABELS.length)];
        }

        let roll = Math.random() * totalWeight;
        for (const entry of entries) {
          roll -= entry.weight;
          if (roll <= 0) {
            return entry.label;
          }
        }

        return entries[entries.length - 1].label;
      }

      function shouldAwardRegularProduct(nowMs) {
        const remainingProducts = getRemainingProductCount();
        if (remainingProducts <= 0) {
          return false;
        }

        // The admin-set master win rate takes priority; the estimate below is
        // only a fallback for when no server settings were ever synced.
        if (serverSettings && Number.isFinite(serverSettings.masterWinRate)) {
          return Math.random() * 100 < serverSettings.masterWinRate;
        }

        const remainingEventMs = getRemainingEventMs(nowMs);
        if (remainingEventMs <= 0) {
          return false;
        }

        const remainingHours = remainingEventMs / (60 * 60 * 1000);
        const estimatedRemainingSpins = Math.max(
          1,
          Math.ceil(remainingHours * ESTIMATED_SPINS_PER_HOUR)
        );
        const isLowStock = remainingProducts <= LOW_STOCK_THRESHOLD;
        const minWinRate = isLowStock
          ? LOW_STOCK_MIN_PRODUCT_WIN_RATE
          : MIN_PRODUCT_WIN_RATE;
        const maxWinRate = isLowStock
          ? LOW_STOCK_MAX_PRODUCT_WIN_RATE
          : MAX_PRODUCT_WIN_RATE;
        const targetWinRate = clamp(
          remainingProducts / estimatedRemainingSpins,
          minWinRate,
          maxWinRate
        );

        return Math.random() < targetWinRate;
      }

      function getRandomWheelIndexForItem(itemName) {
        const matchingIndexes = [];
        for (let i = 0; i < wheelItems.length; i++) {
          if (wheelItems[i] === itemName) {
            matchingIndexes.push(i);
          }
        }

        if (!matchingIndexes.length) {
          return 0;
        }

        return matchingIndexes[
          Math.floor(Math.random() * matchingIndexes.length)
        ];
      }

      function pickPrizeForSpinLocal() {
        const nowMs = Date.now();
        const inEventWindow = isPrizeWindowOpen(nowMs);
        const mouseKeys = getMouseKeys();
        const mouseAvailable = getInventoryCountForKeys(mouseKeys) > 0;
        const mouseTimerActive = isMouseTimerEnabled() && mouseAvailable;

        // The server keeps its exact due time private, so offline fallback
        // runs its own schedule; start one on the first offline spin.
        if (mouseTimerActive && nextMouseDueAt === null) {
          nextMouseDueAt = nowMs + randomMouseIntervalMs();
        }

        const shouldForceMouse =
          inEventWindow &&
          mouseTimerActive &&
          nextMouseDueAt !== null &&
          nowMs >= nextMouseDueAt;

        if (shouldForceMouse) {
          const forcedMouse = pickWeightedProduct({
            includeOnlyKeys: mouseKeys,
          });
          if (!forcedMouse) {
            return pickLossLabel();
          }

          prizeInventory[forcedMouse] -= 1;
          savePrizeInventory();
          nextMouseDueAt = nowMs + randomMouseIntervalMs();
          return forcedMouse;
        }

        if (!inEventWindow) {
          return pickLossLabel();
        }

        if (!shouldAwardRegularProduct(nowMs)) {
          return pickLossLabel();
        }

        const weightedPick = pickWeightedProduct({
          excludeKeys: mouseTimerActive ? mouseKeys : [],
        });
        if (!weightedPick) {
          return pickLossLabel();
        }

        prizeInventory[weightedPick] -= 1;
        savePrizeInventory();
        return weightedPick;
      }

      async function pickPrizeForSpin() {
        const remoteSpin = await requestServerSpin();
        if (remoteSpin?.prize) {
          return remoteSpin.prize;
        }

        return pickPrizeForSpinLocal();
      }

      function getWrappedLabelLines(label, maxLines = 2, charsPerLine = 13) {
        if (typeof label !== "string" || !label.trim()) {
          return ["Try Again"];
        }

        const words = label.trim().split(/\s+/);
        if (words.length === 1) {
          return [label];
        }

        const lines = [];
        let currentLine = "";

        for (const word of words) {
          const testLine = currentLine ? `${currentLine} ${word}` : word;

          if (testLine.length <= charsPerLine || currentLine.length === 0) {
            currentLine = testLine;
            continue;
          }

          lines.push(currentLine);
          currentLine = word;

          if (lines.length === maxLines - 1) {
            break;
          }
        }

        if (currentLine) {
          const consumedWords = lines
            .join(" ")
            .split(/\s+/)
            .filter(Boolean).length;
          const remainingWords = words.slice(consumedWords).join(" ");
          lines.push(remainingWords || currentLine);
        }

        if (lines.length > maxLines) {
          const firstLines = lines.slice(0, maxLines - 1);
          const overflow = lines.slice(maxLines - 1).join(" ");
          return [...firstLines, overflow];
        }

        return lines;
      }

      function getFittedFontSize(lines, startSize, minSize, maxWidth) {
        let size = startSize;
        while (size > minSize) {
          ctx.font = `italic 900 ${size}px ${LABEL_FONT_FAMILY}`;
          const widestLine = Math.max(
            ...lines.map((line) => ctx.measureText(line).width)
          );
          if (widestLine <= maxWidth) {
            return size;
          }
          size -= 2;
        }
        return minSize;
      }

      // Draw the wheel
      function drawWheel() {
        const numSlices = wheelItems.length;
        const sliceAngle = (2 * Math.PI) / numSlices;

        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        ctx.save();
        ctx.translate(centerX, centerY);
        // Rotate so the first slice starts perfectly at the top pointer
        ctx.rotate(-Math.PI / 2);

        for (let i = 0; i < numSlices; i++) {
          const angle = i * sliceAngle;
          const isStandout = PRIZE_PRIORITY.slice(0, 3).includes(wheelItems[i]);

          // Draw the colored slice
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, angle, angle + sliceAngle);

          if (isStandout) {
            ctx.fillStyle = standoutColors[i % standoutColors.length];
          } else {
            ctx.fillStyle = standardColors[i % standardColors.length];
          }
          ctx.fill();

          // Add an outline for crisp edges
          ctx.lineWidth = 8;
          ctx.strokeStyle = "#022c22"; // Green 950
          ctx.stroke();

          // Draw the text
          ctx.save();
          ctx.rotate(angle + sliceAngle / 2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";

          ctx.fillStyle = isStandout ? "#022c22" : "#ecfccb";

          const labelLines = getWrappedLabelLines(
            wheelItems[i],
            2,
            numSlices <= 10 ? 13 : 11
          );
          const maxLabelWidth = radius * 0.54;
          const targetSize = Math.max(
            34,
            Math.min(62, (radius * 1.15) / numSlices + 16)
          );
          const fontSize = getFittedFontSize(
            labelLines,
            targetSize,
            24,
            maxLabelWidth
          );
          const lineHeight = fontSize * 0.95;

          ctx.font = `italic 900 ${fontSize}px ${LABEL_FONT_FAMILY}`;

          ctx.shadowColor = isStandout
            ? "rgba(255, 255, 255, 0.4)"
            : "rgba(0, 0, 0, 0.8)";
          ctx.shadowBlur = isStandout ? 4 : 8;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 2;

          const textAnchorX = radius * 0.86;
          const firstLineY = -((labelLines.length - 1) * lineHeight) / 2;

          for (let lineIndex = 0; lineIndex < labelLines.length; lineIndex++) {
            ctx.fillText(
              labelLines[lineIndex],
              textAnchorX,
              firstLineY + lineIndex * lineHeight
            );
          }
          ctx.restore();
        }

        // Center details
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.12, 0, 2 * Math.PI);
        ctx.fillStyle = "#022c22";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.08, 0, 2 * Math.PI);
        ctx.fillStyle = "#bef264";
        ctx.fill();

        // Inner circle highlight
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.04, 0, 2 * Math.PI);
        ctx.fillStyle = "#ffffff";
        ctx.fill();

        ctx.restore();
      }

      // Fire Confetti Animation
      function fireConfetti() {
        const duration = 3000;
        const end = Date.now() + duration;

        (function frame() {
          confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: ["#bef264", "#a3e635", "#166534", "#ffffff"],
          });
          confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: ["#bef264", "#a3e635", "#166534", "#ffffff"],
          });

          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        })();
      }

      async function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;
        winnerDisplay.innerHTML =
          '<span class="animate-pulse text-lime-400">Spinning...</span>';

        const pickedPrize = await pickPrizeForSpin();
        pendingWinnerItem = pickedPrize;

        // If the prize isn't drawn yet (item added on /admin.html after the
        // last rebuild), rebuild the wheel with it included before spinning.
        // Loss detection is by EXACT label match — item names are admin-
        // controlled and may contain similar words.
        const pickIsLoss = LOSS_LABELS.includes(pickedPrize);
        if (!pickIsLoss && !wheelItems.includes(pickedPrize)) {
          rebuildWheel([pickedPrize]);
        }

        const sliceAngle = 360 / wheelItems.length;
        const targetIndex = getRandomWheelIndexForItem(pickedPrize);
        const centerOfSlice = targetIndex * sliceAngle + sliceAngle / 2;
        const jitter = (Math.random() - 0.5) * sliceAngle * 0.5;
        const desiredActualRotation =
          (360 - (centerOfSlice + jitter) + 360) % 360;

        const currentActualRotation = ((currentRotation % 360) + 360) % 360;
        const deltaToTarget =
          (desiredActualRotation - currentActualRotation + 360) % 360;
        const baseSpins = 5 + Math.floor(Math.random() * 5);
        const totalDegreesToSpin = baseSpins * 360 + deltaToTarget;

        currentRotation += totalDegreesToSpin;

        canvas.style.transition =
          "transform 5s cubic-bezier(0.1, 0.8, 0.15, 1.05)";
        canvas.style.transform = `rotate(${currentRotation}deg)`;
      }

      // Listen for the end of the spin transition
      canvas.addEventListener("transitionend", () => {
        isSpinning = false;

        const actualRotation = currentRotation % 360;
        const pointerAngle = (360 - actualRotation) % 360;
        const sliceAngle = 360 / wheelItems.length;
        const winnerIndex = Math.floor(pointerAngle / sliceAngle);

        const winnerItem = pendingWinnerItem || wheelItems[winnerIndex];
        pendingWinnerItem = null;
        winnerDisplay.innerHTML = "";

        const resultModal = document.getElementById("resultModal");
        const resultContent = document.getElementById("resultContent");
        const resultTitle = document.getElementById("resultTitle");
        const resultPrize = document.getElementById("resultPrize");
        const closeModal = document.getElementById("closeModal");

        // Exact match only: an admin-added prize named e.g. "Spin The Dew
        // Again Sticker" is a real win, not a loss.
        const isLoss = LOSS_LABELS.includes(winnerItem);

        if (isLoss) {
          // Loss Theme
          resultContent.className =
            "pixel-panel text-center p-8 md:p-14 border-4 border-green-800 bg-green-950 shadow-[0_0_80px_rgba(20,83,45,0.8)] transform scale-50 transition-transform duration-500 w-[90%] max-w-xl relative";
          resultTitle.textContent = "YOU GOT NO DEW!";
          resultTitle.className =
            "pixel-title text-3xl md:text-5xl mb-4 uppercase text-green-600 drop-shadow-[0_0_10px_rgba(22,101,52,0.8)] relative z-10 break-words";
          resultPrize.textContent = winnerItem;
          resultPrize.className =
            "pixel-text text-2xl md:text-4xl text-green-200 mb-8 relative z-10 drop-shadow-md";
          closeModal.className =
            "pixel-btn bg-green-800 hover:bg-green-700 text-green-200 uppercase text-sm md:text-lg py-4 px-10 md:px-14 border-b-8 border-green-900 active:border-b-0 active:translate-y-[8px] transition-all shadow-lg relative z-10";
          closeModal.textContent = "TRY AGAIN";
        } else {
          // Win Theme
          resultContent.className =
            "pixel-panel text-center p-8 md:p-14 border-4 border-lime-500 bg-green-950 shadow-[0_0_80px_rgba(132,204,22,0.6)] transform scale-50 transition-transform duration-500 w-[90%] max-w-xl relative";
          resultTitle.textContent = "CONGRATULATION!";
          resultTitle.className =
            "pixel-title text-3xl md:text-5xl mb-4 uppercase text-lime-400 drop-shadow-[0_0_20px_rgba(132,204,22,0.9)] relative z-10 break-words";
          resultPrize.textContent = `YOU WON: ${winnerItem}`;
          resultPrize.className =
            "pixel-text text-2xl md:text-4xl text-lime-200 mb-8 relative z-10 drop-shadow-md";
          closeModal.className =
            "pixel-btn bg-gradient-to-b from-lime-400 to-lime-600 hover:from-lime-300 hover:to-lime-500 text-green-950 uppercase text-sm md:text-lg py-4 px-10 md:px-14 border-b-8 border-lime-800 active:border-b-0 active:translate-y-[8px] transition-all shadow-lg relative z-10";
          closeModal.textContent = "DEW IT AGAIN";

          // Trigger Confetti!
          fireConfetti();
        }

        resultModal.classList.add("modal-enter");
        setTimeout(() => {
          resultContent.classList.add("modal-content-enter");
        }, 10);

        closeModal.onclick = () => {
          resultContent.classList.remove("modal-content-enter");
          setTimeout(() => {
            resultModal.classList.remove("modal-enter");
            winnerDisplay.innerHTML = `<span class="text-lime-500 font-bold drop-shadow-md">Ready for another spin!</span>`;
            // Stock may have hit zero (or the admin changed items) — refresh
            // the wheel slices between spins.
            rebuildWheelIfChanged();
          }, 300);
        };
      });

      // DevTools console helpers (LOCAL fallback values only — live odds and
      // inventory are managed on /admin.html, which writes to the server).
      window.dewWheelConfig = {
        getChanceMultipliers: () => ({ ...CHANCE_MULTIPLIERS }),
        setChanceMultiplier,
        setChanceMultipliers,
        resetChanceMultipliers,
        getPrizeInventory: () => ({ ...prizeInventory }),
        getProductChancePercentages,
        syncFromServer: fetchServerState,
        downloadInventoryXlsx: () => {
          window.open(INVENTORY_EXPORT_API_URL, "_blank");
        },
      };

      // Initialize
      (async () => {
        const serverState = await fetchServerState();
        if (!serverState) {
          initializeMouseSchedule();
        }

        console.table(getProductChancePercentages());
        rebuildWheel();
        spinBtn.addEventListener("click", spinWheel);

        // Keep the wheel synced with /admin.html while the tablet idles.
        setInterval(async () => {
          if (isSpinning) {
            return;
          }
          const epochBefore = stateSyncEpoch;
          const refreshed = await fetchServerState({
            applyGuard: () => !isSpinning && stateSyncEpoch === epochBefore,
          });
          if (refreshed) {
            rebuildWheelIfChanged();
          }
        }, 20000);
      })();
    </script>
  </body>
